[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["node_modules"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "@account-abstraction/contracts/=node_modules/@account-abstraction/contracts/",
  "forge-std/=node_modules/forge-std/src/",
]
# Tests build WebAuthn assertions and run full EntryPoint flows (P-256 verified in Solidity when the
# RIP-7212 / EIP-7951 precompile is absent), so they need a generous gas limit.
gas_limit = 1_000_000_000

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 32

[fmt]
line_length = 120

[lint]
# Public `implementation()` / `token()` getters keep their conventional names.
exclude_lints = ["screaming-snake-case-immutable", "asm-keccak256"]
